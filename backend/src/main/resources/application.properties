server.port=${SERVER_PORT:8180}
server.address=127.0.0.1
spring.application.name=enterprise-helpdesk
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:55432/helpdesk}
spring.datasource.username=${DB_USERNAME:helpdesk}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=hd_business
spring.flyway.enabled=true
spring.flyway.table=hd_flyway_history
spring.flyway.default-schema=hd_business
spring.flyway.schemas=hd_business
spring.flyway.create-schemas=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.error.include-message=never
server.error.include-stacktrace=never
app.ai.base-url=${AI_BASE_URL:http://127.0.0.1:8101}
app.ai.token=${AI_SERVICE_TOKEN:}
app.seed.admin=${ADMIN_PASSWORD:}
app.seed.agent=${AGENT_PASSWORD:}
app.seed.employee=${EMPLOYEE_PASSWORD:}
app.seed.hr=${HR_PASSWORD:}
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
