name: enterprise-helpdesk
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run setup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-56379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.6
    command: ['/data']
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Run setup}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Run setup}
      RUSTFS_RPC_SECRET: ${RUSTFS_RPC_SECRET:?Run setup}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '127.0.0.1:${S3_PORT:-59000}:9000'
      - '127.0.0.1:59001:9001'
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ['CMD', '/usr/bin/curl', '--fail', '--silent', 'http://localhost:9000/health/ready']
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
  redis_data:
  rustfs_data:
